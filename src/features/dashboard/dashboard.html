<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="components/ScheduleCard/ScheduleCard.css">

</head>

<body>
  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">

        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../..//assets/LogoSinFondo.png" class="logo">
          <span class="ms-2 fw-semibold brand-name">
            LAN HUA
          </span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" href="dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link">Usuarios</a>
            </li>

          </ul>

          <div class="d-flex flex-column flex-lg-row gap-3">
            <a href="#" class="flex-fill">
              <button class="btnLogout w-100">
                <i class="fa-solid fa-right-from-bracket small"></i>
                Cerrar Sesión
              </button>
            </a>
          </div>
        </div>

      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div
        class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3 mt-4 dashboardHeader">
        <div>
          <h1 class="h2 mb-1">Horarios Disponibles</h1>
          <p class="fst-italic small text-muted mb-0">
            Crea, organiza y administra las clases del Club LAN HUA de forma sencilla.
          </p>
        </div>
        <button class="btnAddSchedule" id="">
          <i class="fa-solid fa-plus small"></i>
          Agregar Horario
        </button>
      </div>

      <div class="cards mt-4" id="schedules">

        <article class="class-card border">
          <div class="position-relative">
            <img src="../../assets/1.png" alt="Rutina de entrenamiento" class="card-img-top">
            <span class="badge position-absolute bottom-0 start-0 m-2 class-badge">Principiante</span>
          </div>

          <div class="card-body p-3 d-flex flex-column gap-2">
            <h4 class="class-title h5 m-0 fw-bold">Rutina</h4>

            <div class="d-flex flex-column gap-2 fs-6">

              <div class="class-item d-flex align-items-center gap-2">
                <i class="fa-solid fa-users" aria-hidden="true"></i>
                <span>15 Cupos disponibles</span>
              </div>

              <div class="class-item d-flex align-items-center gap-2">
                <i class="fa-solid fa-calendar" aria-hidden="true"></i>
                <time datetime="2026-07-02T18:00" class="d-flex gap-1">
                  <span>2 Julio 2026</span>
                  <span>—</span>
                  <span>Lunes 6 PM</span>
                </time>
              </div>

              <div class="class-item d-flex align-items-center gap-2">
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                <span>Ubicación: Medellín</span>
              </div>

              <div class="class-item d-flex align-items-center gap-2">
                <i class="fa-solid fa-shoe-prints" aria-hidden="true"></i>
                <span>Modalidad: Grupal</span>
              </div>
            </div>

            <hr class="my-2 opacity-25">

            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-action rounded-circle p-0 d-flex align-items-center justify-content-center"
                type="button" aria-label="Actualizar clase" title="Actualizar">
                <i class="fa-solid fa-pen"></i>
              </button>

              <button class="btn btn-action-danger rounded-circle p-0 d-flex align-items-center justify-content-center"
                type="button" aria-label="Eliminar clase" title="Eliminar">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </article>

      </div>
    </div>


  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="dashboard.js" type="module"></script>

</body>

</html>
