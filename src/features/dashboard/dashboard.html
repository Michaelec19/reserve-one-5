<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="components/ScheduleCard/ScheduleCard.css">
  <link rel="stylesheet" href="../../shared/components/Alert/Alert.css">
</head>

<body>
  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">

        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../../assets/LogoSinFondo.png" class="logo">
          <span class="ms-2 fw-semibold brand-name">
            LAN HUA
          </span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" href="dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link">Usuarios</a>
            </li>

          </ul>

          <div class="d-flex flex-column flex-lg-row gap-3">
            <a href="#" class="flex-fill">
              <button class="btnLogout w-100">
                <i class="fa-solid fa-right-from-bracket small"></i>
                Cerrar Sesión
              </button>
            </a>
          </div>
        </div>

      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div
        class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3 mt-4 dashboardHeader">
        <div>
          <h1 class="h2 mb-1">Horarios Disponibles</h1>
          <p class="fst-italic small text-muted mb-0">
            Crea, organiza y administra las clases del Club LAN HUA de forma sencilla.
          </p>
        </div>
        <button class="btnAddSchedule" id="" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
          <i class="fa-solid fa-plus small"></i>
          Agregar Horario
        </button>
      </div>

      <div class="cards mt-4" id="schedules"> </div>

      <!-- MODAL CON EL FORMULARIO INTEGRADO -->
      <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">Gestionar Horario</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

              <!-- FORMULARIO -->
              <form id="formularioHorario">

                <!-- Otros campos (puedes agregar o quitar según tu necesidad) -->
                <div class="mb-3">
                  <label for="nombreClase" class="form-label">Nombre de la clase</label>
                  <input type="text" class="form-control" id="nombreClase" placeholder="Ej. Kung Fu" required>
                </div>

                <!-- ESTE ES EL CAMPO DE UBICACIÓN CORREGIDO (Menú desplegable) -->
                <div class="mb-3">
                  <label for="ubicacionSede" class="form-label">Ubicación</label>
                  <select class="form-select" id="ubicacionSede" name="ubicacionSede" required>
                    <option value="" selected disabled>Selecciona una sede...</option>
                    <option value="Sede Laureles">Sede Laureles</option>
                    <option value="Sede Monterrey">Sede Monterrey</option>
                    <option value="Sede Haru no Hinata">Sede Haru no Hinata</option>
                  </select>
                </div>

              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" form="formularioHorario" class="btn btn-primary"
                style="background-color: #BF2A37; border: none;">Guardar</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="dashboard.js" type="module"></script>

</body>

</html>
