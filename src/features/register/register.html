<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Lan Hua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../../shared/css/reset.css">
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../landing/landing.css">
    <link rel="stylesheet" href="../../shared/components/Header/Header.css">
    <link rel="stylesheet" href="register.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <header class="header sticky-top">
        <div class="container">
            <nav class="navbar navbar-expand-lg px-0">

                <a class="navbar-brand d-flex align-items-center" href="../../index.html">
                    <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo Lan Hua">
                    <span class="ms-2 fw-semibold brand-name">
                        LAN HUA
                    </span>
                </a>

                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-between" id="navbar">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../../features/landing/about/about.html">Nosotros</a>
                        </li>

                        <li class=" nav-item">
                            <a class="nav-link" href="../landing/catalog_users/catalog_user.html">Clases</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../landing/contact/contact.html">Contacto</a>
                        </li>
                    </ul>

                    <div class="d-flex flex-column flex-lg-row gap-3">
                        <a href="features/landing/catalog_users/catalog_user.html" class="flex-fill">
                            <button class="btnBooking w-100">
                                Reserva tu Clase
                            </button>
                        </a>

                        <a href="#" class="flex-fill">
                            <button class="btnLogin w-100">
                                Ingresar
                            </button>
                        </a>
                    </div>
                </div>

            </nav>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="contact-card">

                    <h2 class="text-center fw-bold mb-1 text-light">Crear Cuenta</h2>
                    <p class="text-center subtitle-custom mb-4">Regístrate para reservar tus clases en Lan Hua</p>

                    <form id="registerForm" novalidate>
                        <!-- Nombre Completo -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label-custom">Nombre Completo</label>
                            <input type="text" class="form-input-custom" id="fullName" placeholder="Ej. Juan Pérez"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label-custom">Correo Electrónico</label>
                            <input type="email" class="form-input-custom" id="email" placeholder="usuario@ejemplo.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label-custom">Contraseña</label>
                            <input type="password" class="form-input-custom" id="password"
                                placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label-custom">Confirmar Contraseña</label>
                            <input type="password" class="form-input-custom" id="confirmPassword"
                                placeholder="Repite tu contraseña" required>
                        </div>

                        <button type="submit" class="btn-submit-custom">
                            <i class="fa-solid fa-user-plus me-2"></i>Registrarse
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="footer-text-custom">¿Ya tienes una cuenta?</span>
                        <a href="../auth/login.html" class="text-decoration-none fw-bold ms-1 link-custom">Inicia
                            Sesión</a>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script type="module">
        import { loadFooter } from '../../shared/components/Footer/Footer.js';
        document.addEventListener("DOMContentLoaded", () => {
            loadFooter();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="register.js" type="module"></script>
</body>

</html>
