<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN HUA | Autenticación</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />

  <link rel="stylesheet" href="/src/shared/css/reset.css" />
  <link rel="stylesheet" href="/src/shared/css/variables.css" />
  <link rel="stylesheet" href="/src/features/auth/auth.css" />
</head>

<body class="d-flex flex-column min-vh-100">

  <div class="text-center pt-5 pb-3">
    <a href="../../index.html" class="text-decoration-none d-inline-flex align-items-center">
      <img src="../../assets/LogoSinFondo.png" alt="LAN HUA Logo" style="height: 50px;" />
      <span class="ms-2 fw-bold fs-3 text-black">LAN HUA</span>
    </a>
  </div>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="card border-secondary p-4 p-md-5 shadow-lg text-white w-100"
      style="max-width: 450px; background-color: rgba(33, 37, 41, 0.95); border-radius: 12px;">

      <ul class="nav nav-pills nav-justified mb-4 auth-tabs" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login"
            type="button" role="tab" aria-controls="login" aria-selected="true">
            Ingresar
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register"
            type="button" role="tab" aria-controls="register" aria-selected="false">
            Crear Cuenta
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">

        <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
          <div class="text-center mb-4">
            <h4 class="fw-bold text-white">Bienvenido</h4>
            <p class="small text-secondary mb-0">Ingresa tus datos para continuar</p>
          </div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginCorreo" class="form-label small text-warning">Correo electrónico</label>
              <input type="email" class="form-control bg-secondary text-white border-0" id="loginCorreo"
                placeholder="santiago1234@lanhua.com" required />
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label small text-warning">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control bg-secondary text-white border-0 shadow-none"
                  id="loginPassword" placeholder="********" required />
                <button class="btn btn-outline-secondary border-0 toggle-password" type="button"
                  data-target="loginPassword">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input bg-secondary border-0 shadow-none" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-light" for="rememberMe">Recordarme</label>
              </div>
              <a href="#" class="small text-decoration-none" style="color: #f2be22;">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="d-grid">
              <button type="submit"
                class="btn fw-bold py-2 shadow-sm d-flex justify-content-center align-items-center gap-2"
                style="background-color: #f2be22; color: #0d0d0d">
                <span>Iniciar Sesión</span>
                <div class="spinner-border spinner-border-sm d-none" role="status" id="loginSpinner"></div>
              </button>
            </div>
          </form>
        </div>

        <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
          <div class="text-center mb-4">
            <h4 class="fw-bold text-white">Únete a LAN HUA</h4>
            <p class="small text-secondary mb-0">Comienza tu camino marcial hoy</p>
          </div>
          <form id="registerForm">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="regNombre" class="form-label small text-warning">Nombre</label>
                <input type="text" class="form-control bg-secondary text-white border-0" id="regNombre"
                  placeholder="Ej. Sebastian" required />
              </div>
              <div class="col-6">
                <label for="regApellido" class="form-label small text-warning">Apellido</label>
                <input type="text" class="form-control bg-secondary text-white border-0" id="regApellido"
                  placeholder="Ej. Cardona" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="regCorreo" class="form-label small text-warning">Correo electrónico</label>
              <input type="email" class="form-control bg-secondary text-white border-0" id="regCorreo"
                placeholder="correo@lanhua.com" required />
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label small text-warning">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control bg-secondary text-white border-0 shadow-none"
                  id="regPassword" placeholder="Mínimo 8 caracteres" required />
                <button class="btn btn-outline-secondary border-0 toggle-password" type="button"
                  data-target="regPassword">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label for="regConfirmPassword" class="form-label small text-warning">Confirmar Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control bg-secondary text-white border-0 shadow-none"
                  id="regConfirmPassword" placeholder="Repite tu contraseña" required />
                <button class="btn btn-outline-secondary border-0 toggle-password" type="button"
                  data-target="regConfirmPassword">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit"
                class="btn fw-bold py-2 shadow-sm d-flex justify-content-center align-items-center gap-2"
                style="background-color: #f2be22; color: #0d0d0d">
                <span>Crear Cuenta</span>
                <div class="spinner-border spinner-border-sm d-none" role="status" id="registerSpinner"></div>
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="py-4 text-center">
    <div class="container">
      <p class="small text-secondary mb-1">&copy; 2026 LAN HUA. Todos los derechos reservados.</p>
      <div>
        <a href="#" class="small text-secondary text-decoration-none me-3">Términos y Condiciones</a>
        <a href="#" class="small text-secondary text-decoration-none">Política de Privacidad</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/src/features/auth/auth.js" type="module"></script>

</body>

</html>
